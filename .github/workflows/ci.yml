name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
      - run: golangci-lint fmt --diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
      - name: Check example plugins
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/elzar/plugins"
          cp examples/plugins/* "$tmp/elzar/plugins/"
          chmod 0700 "$tmp/elzar/plugins/job-info.sh"
          chmod 0600 "$tmp/elzar/plugins/"*.yaml
          XDG_CONFIG_HOME="$tmp" ./elzar plugins
